# config.yaml
meta:
  experiment_id: "SCI_Edge_Control_Final"
  description: "Distributed Edge Control with 4D Trajectory Scheduling"

simulation:
  duration: 1500
  dt: 0.01
  speed_up: 50.0
  visualization: true
  safe_distance: 20.0

environment:
  mud_factor: 0.5
  jam_prob_base: 0.0001

algorithms:
  scheduler: "TimeSpace"
  controller: "FuzzyPID"

topology:
  rows: 4
  cols: 4
  cell_spacing: 300.0
  depots:
    Start_1: [-150, 900]
    Start_2: [-150, 300]

vehicle_types:
  Heavy_Hauler:
    mass_full: 5000.0
    mass_empty: 2000.0
    # [提速修改] 功率加到 80kW，极速设为 12.0 m/s (约 43.2 km/h)
    max_power: 80000.0
    max_speed: 12.0
    length: 12.0
    loading_time: 5.0
    unloading_time: 5.0
    pid: {kp: 2000, ki: 10, kd: 500}
    smc: {lambda: 2.0, k: 5000.0}
    link_type: "LoRa"

  Fast_Scout:
    mass_full: 3000.0
    mass_empty: 800.0
    # [提速修改] 侦察车更轻，可以跑得更快，设为 15.0 m/s (54 km/h)
    max_power: 60000.0
    max_speed: 15.0
    length: 8.0
    loading_time: 3.0
    unloading_time: 3.0
    pid: {kp: 800, ki: 5, kd: 200}
    smc: {lambda: 3.0, k: 3000.0}
    link_type: "WiFi"

energy_params:
  idle_power: 20.0
  motor_efficiency: 0.85
  comm_energy:
    LoRa: 0.005
    WiFi: 0.0001
# config.yaml
meta:
  experiment_id: "SCI_Edge_Control_Final"
  description: "Distributed Edge Control with 4D Trajectory Scheduling"

simulation:
  duration: 1500
  dt: 0.01          # <--- [关键] 从 0.1 改为 0.01，提高10倍精度
  speed_up: 50.0    # 稍微调高加速倍率，弥补 dt 变小带来的慢动作
  visualization: true
  safe_distance: 20.0

environment:
  mud_factor: 0.5
  # 基础故障率 (Weibull分布参数)
  jam_prob_base: 0.0001

# [SCI核心] 算法对比开关
algorithms:
  # "TimeSpace": 4D时空预约 (Advanced)
  # "Lock": 互斥锁 (Baseline)
  scheduler: "TimeSpace"

  # "FuzzyPID": 模糊自适应 (Main Method)
  # "SMC": 滑模控制 (Robust Baseline)
  controller: "FuzzyPID"

topology:
  rows: 4
  cols: 4
  cell_spacing: 300.0
  depots:
    Start_1: [-150, 900]
    Start_2: [-150, 300]

vehicle_types:
  Heavy_Hauler:
    mass_full: 5000.0
    mass_empty: 2000.0
    max_power: 12000.0
    max_speed: 6.0
    length: 12.0
    loading_time: 5.0
    unloading_time: 5.0
    pid: {kp: 2000, ki: 10, kd: 500}
    smc: {lambda: 2.0, k: 5000.0}
    link_type: "LoRa"

  Fast_Scout:
    mass_full: 1500.0
    mass_empty: 800.0
    max_power: 5000.0
    max_speed: 10.0
    length: 8.0
    loading_time: 3.0
    unloading_time: 3.0
    pid: {kp: 800, ki: 5, kd: 200}
    smc: {lambda: 3.0, k: 3000.0}
    link_type: "WiFi"

energy_params:
  idle_power: 20.0
  motor_efficiency: 0.85
  comm_energy:
    LoRa: 0.005
    WiFi: 0.0001